# Local/offline stack: PostGIS + FastAPI. (Frontend: `cd frontend && npm run dev`.)
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: terra, POSTGRES_USER: terra, POSTGRES_PASSWORD: terra_local_only }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://terra:terra_local_only@db:5432/terra
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes: [".:/app"]
    command: sh -c "pip install -q -r backend/requirements.txt && cd backend && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
volumes: { pgdata: {} }
